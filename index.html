<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ Ashraf & Aya ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background:
        radial-gradient(circle at top, #fff0f5 0%, #f9d5df 35%, #d98fa5 100%);
    color: #5a2434;
    overflow-x: hidden;
}

/* القلوب */
.hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.heart {
    position: absolute;
    bottom: -50px;
    font-size: 25px;
    opacity: 0;
    animation: float 9s linear infinite;
}

.heart:nth-child(1) { left: 8%; animation-delay: 0s; }
.heart:nth-child(2) { left: 23%; animation-delay: 2s; }
.heart:nth-child(3) { left: 40%; animation-delay: 4s; }
.heart:nth-child(4) { left: 58%; animation-delay: 1s; }
.heart:nth-child(5) { left: 75%; animation-delay: 3s; }
.heart:nth-child(6) { left: 90%; animation-delay: 5s; }

@keyframes float {
    0% {
        transform: translateY(0) scale(.7) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    85% {
        opacity: .8;
    }

    100% {
        transform: translateY(-110vh) scale(1.3) rotate(25deg);
        opacity: 0;
    }
}

/* شاشة الباسورد */
#lockScreen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background:
        linear-gradient(145deg, #fff1f5, #e9b4c2);
}

.lockBox {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,.88);
    padding: 35px 25px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(100,30,50,.25);
}

.lockBox .bigHeart {
    font-size: 65px;
    animation: beat 1.4s infinite;
}

@keyframes beat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

.lockBox h1 {
    margin: 15px 0 10px;
    font-size: 28px;
}

.lockBox p {
    font-size: 17px;
    margin-bottom: 22px;
    line-height: 1.8;
}

#password {
    width: 100%;
    padding: 16px;
    border: 2px solid #e0a0b2;
    border-radius: 15px;
    text-align: center;
    font-size: 24px;
    outline: none;
    letter-spacing: 8px;
    color: #6d263c;
}

#password:focus {
    border-color: #b84d70;
}

.openBtn {
    width: 100%;
    margin-top: 15px;
    padding: 16px;
    border: none;
    border-radius: 15px;
    background: #a83f61;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

#error {
    color: #b51f43;
    margin-top: 12px;
    display: none;
    font-size: 16px;
}

/* الصفحة */
#mainContent {
    display: none;
    position: relative;
    z-index: 2;
    padding: 30px 15px 60px;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    text-align: center;
}

/* العنوان */
.title {
    font-size: clamp(27px, 7vw, 48px);
    margin: 15px 0 8px;
    color: #7b2945;
}

.subtitle {
    font-size: clamp(18px, 4.5vw, 25px);
    margin-bottom: 30px;
}

/* الصور */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin: 25px auto 35px;
    max-width: 700px;
}

.photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 22px;
    border: 5px solid rgba(255,255,255,.8);
    box-shadow: 0 10px 30px rgba(80,20,40,.25);
    animation: photoFloat 4s ease-in-out infinite;
}

.photo:nth-child(2) { animation-delay: .5s; }
.photo:nth-child(3) { animation-delay: 1s; }
.photo:nth-child(4) { animation-delay: 1.5s; }

@keyframes photoFloat {
    0%,100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-7px) rotate(1deg);
    }
}

/* الرسالة */
.message {
    background: rgba(255,255,255,.82);
    padding: 30px 22px;
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(80,20,40,.18);
    line-height: 2.2;
    font-size: clamp(18px, 4.7vw, 24px);
    text-align: right;
}

.message .from {
    text-align: center;
    font-size: clamp(21px, 5vw, 28px);
    font-weight: bold;
    color: #8d2f4e;
    margin-bottom: 25px;
}

.message p {
    margin-bottom: 18px;
}

.love {
    text-align: center;
    font-size: clamp(24px, 6vw, 35px);
    font-weight: bold;
    color: #a52d50;
    margin-top: 25px;
}

/* التاريخ */
.date {
    margin-top: 28px;
    font-size: 20px;
    color: #7b2945;
}

/* مشغل الأغنية */
.musicBox {
    margin: 25px auto;
    max-width: 500px;
}

audio {
    width: 100%;
}

/* الموبايل */
@media (max-width: 600px) {
    .gallery {
        gap: 10px;
    }

    .message {
        padding: 25px 17px;
    }
}
</style>
</head>

<body>

<!-- القلوب -->
<div class="hearts">
    <div class="heart">❤️</div>
    <div class="heart">💕</div>
    <div class="heart">💗</div>
    <div class="heart">❤️</div>
    <div class="heart">💖</div>
    <div class="heart">💕</div>
</div>

<!-- شاشة الباسورد -->
<div id="lockScreen">

    <div class="lockBox">

        <div class="bigHeart">❤️</div>

        <h1>Ashraf ❤️ Aya</h1>

        <p>
            رسالة خاصة إلى<br>
            <strong>Aya</strong><br>
            اكتبي الباسورد عشان تفتحي رسالتك 💕
        </p>

        <input
            type="password"
            id="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="••••"
        >

        <button class="openBtn" onclick="openLove()">
            ❤️ افتحي رسالتك ❤️
        </button>

        <div id="error">
            الباسورد غلط يا حبيبتي ❤️
        </div>

    </div>

</div>


<!-- المحتوى -->
<div id="mainContent">

    <div class="container">

        <h1 class="title">
            ❤️ From Ashraf To Aya ❤️
        </h1>

        <div class="subtitle">
            إلى آية… حبيبتي ومراتي وأجمل حاجة حصلت في حياتي ❤️
        </div>

        <!-- الصور -->
        <div class="gallery">
